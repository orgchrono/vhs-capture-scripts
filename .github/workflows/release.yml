name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'  # Dispara automaticamente quando você criar uma tag v1.0.0
  workflow_dispatch: # Permite disparo manual via botão na interface do GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: VHS_Studio_Pro-Windows
            sep: ";"
          - os: ubuntu-latest
            artifact_name: VHS_Studio_Pro-Linux
            sep: ":"
          - os: macos-latest
            artifact_name: VHS_Studio_Pro-macOS
            sep: ":"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[ai,cloud]
        pip install pyinstaller
        
    - name: Build UI
      run: |
        cd ui
        npm ci
        npm run build
        
    - name: Package with PyInstaller
      run: |
        pyinstaller --noconfirm --clean --name "${{ matrix.artifact_name }}" --windowed --add-data "ui/dist${{ matrix.sep }}ui/dist" --add-data "vhs_advanced_config.toml${{ matrix.sep }}." src/vhs_studio/cli/desktop.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.artifact_name }}*
        
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true