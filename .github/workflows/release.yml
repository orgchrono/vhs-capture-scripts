name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: VHS_Studio_Pro-Windows
            archive_name: VHS_Studio_Pro-Windows.zip
            binary_name: vhs-studio.exe
            target_binary: VHS_Studio_Pro.exe
          - os: ubuntu-latest
            artifact_name: VHS_Studio_Pro-Linux
            archive_name: VHS_Studio_Pro-Linux.tar.gz
            binary_name: vhs-studio
            target_binary: VHS_Studio_Pro
          - os: macos-latest
            artifact_name: VHS_Studio_Pro-macOS
            archive_name: VHS_Studio_Pro-macOS.zip
            binary_name: vhs-studio
            target_binary: VHS_Studio_Pro

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install System Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ffmpeg libgl1 libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Build & Verify Native Panasonic C Tools
      run: |
        node scripts/build_panasonic_tools.mts
        node scripts/build_panasonic_tools.mts --verify

    - name: Build UI
      run: |
        cd ui
        npm ci
        npm run build
        cd ..

    - name: Compile Native Rust Release Binary
      run: cargo build --release

    - name: Stage Release Binary
      shell: bash
      run: |
        mkdir -p dist/bundle
        cp -f target/release/${{ matrix.binary_name }} dist/bundle/${{ matrix.target_binary }}
        mkdir -p dist/bundle/ui/dist
        cp -rf ui/dist/* dist/bundle/ui/dist/
        if [ -d "tools" ]; then
          mkdir -p dist/bundle/tools
          cp -rf tools/* dist/bundle/tools/ || true
        fi

    - name: Authenticode Sign Executable (Windows)
      if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_BASE64 != ''
      env:
        WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      shell: pwsh
      run: |
        $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
        $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($certPath, $certBytes)
        signtool sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/bundle/${{ matrix.target_binary }}"
        Remove-Item $certPath -Force

    - name: Codesign Binary (macOS)
      if: runner.os == 'macOS' && env.MACOS_CODESIGN_IDENTITY != ''
      env:
        MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      run: |
        codesign --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "dist/bundle/${{ matrix.target_binary }}"

    - name: Compress Archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path "dist/bundle/*" -DestinationPath "dist/${{ matrix.archive_name }}" -Force

    - name: Compress Archive (Linux)
      if: runner.os == 'Linux'
      run: |
        cd dist/bundle
        tar -czvf "../${{ matrix.archive_name }}" *
        cd ../..

    - name: Compress Archive (macOS)
      if: runner.os == 'macOS'
      run: |
        cd dist/bundle
        zip -r "../${{ matrix.archive_name }}" *
        cd ../..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.archive_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Cryptographic SHA-256 Fixity Manifest
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          generate_release_notes: true