name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: VHS_Studio_Pro-Windows
            archive_name: VHS_Studio_Pro-Windows.zip
            sep: ";"
            icon: "assets/vhs_icon.ico"
          - os: ubuntu-latest
            artifact_name: VHS_Studio_Pro-Linux
            archive_name: VHS_Studio_Pro-Linux.tar.gz
            sep: ":"
            icon: "assets/vhs_icon.png"
          - os: macos-latest
            artifact_name: VHS_Studio_Pro-macOS
            archive_name: VHS_Studio_Pro-macOS.zip
            sep: ":"
            icon: "assets/vhs_icon.icns"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        uv pip install --system -e .[ai,cloud] pyinstaller

    - name: Build UI
      run: |
        cd ui
        npm ci
        npm run build

    - name: Package with PyInstaller
      shell: bash
      run: |
        pyinstaller --noconfirm --clean \
          --name "${{ matrix.artifact_name }}" \
          --windowed \
          --add-data "ui/dist${{ matrix.sep }}ui/dist" \
          --add-data "vhs_advanced_config.toml${{ matrix.sep }}." \
          --add-data "assets${{ matrix.sep }}assets" \
          --icon "${{ matrix.icon }}" \
          src/vhs_studio/cli/desktop.py

    - name: Compress Archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path "dist/${{ matrix.artifact_name }}" -DestinationPath "dist/${{ matrix.archive_name }}" -Force

    - name: Compress Archive (Linux)
      if: runner.os == 'Linux'
      run: |
        cd dist
        tar -czvf "${{ matrix.archive_name }}" "${{ matrix.artifact_name }}"
        cd ..

    - name: Compress Archive (macOS)
      if: runner.os == 'macOS'
      run: |
        cd dist
        zip -r "${{ matrix.archive_name }}" "${{ matrix.artifact_name }}"*
        cd ..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.archive_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: true