name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: VHS_Studio_Pro-Windows
            archive_name: VHS_Studio_Pro-Windows.zip
            sep: ";"
            icon: "assets/vhs_icon.ico"
          - os: ubuntu-latest
            artifact_name: VHS_Studio_Pro-Linux
            archive_name: VHS_Studio_Pro-Linux.tar.gz
            sep: ":"
            icon: "assets/vhs_icon.png"
          - os: macos-latest
            artifact_name: VHS_Studio_Pro-macOS
            archive_name: VHS_Studio_Pro-macOS.zip
            sep: ":"
            icon: "assets/vhs_icon.icns"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        uv pip install --system -e .[ai,cloud] pyinstaller

    - name: Build & Verify Native Panasonic C Tools
      run: |
        python scripts/build_panasonic_tools.py
        python scripts/build_panasonic_tools.py --verify

    - name: Build UI
      run: |
        cd ui
        npm ci
        npm run build

    - name: Package with PyInstaller (Zero-UPX AV-Safe Bundle)
      shell: bash
      run: |
        pyinstaller --noconfirm --clean --noupx \
          --name "${{ matrix.artifact_name }}" \
          --onefile \
          --windowed \
          --collect-all uvicorn \
          --collect-all webview \
          --add-data "ui/dist${{ matrix.sep }}ui/dist" \
          --add-data "vhs_advanced_config.toml${{ matrix.sep }}." \
          --add-data "assets${{ matrix.sep }}assets" \
          --add-data "tools/panasonic_rec${{ matrix.sep }}tools/panasonic_rec" \
          --icon "${{ matrix.icon }}" \
          src/vhs_studio/cli/desktop.py

    - name: Authenticode Sign Executable (Windows)
      if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_BASE64 != ''
      env:
        WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      shell: pwsh
      run: |
        $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
        $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($certPath, $certBytes)
        signtool sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/${{ matrix.artifact_name }}.exe"
        Remove-Item $certPath -Force

    - name: Codesign Bundle (macOS)
      if: runner.os == 'macOS' && env.MACOS_CODESIGN_IDENTITY != ''
      env:
        MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      run: |
        codesign --force --deep --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "dist/${{ matrix.artifact_name }}.app" || \
        codesign --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "dist/${{ matrix.artifact_name }}"

    - name: Compress Archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path "dist/${{ matrix.artifact_name }}.exe" -DestinationPath "dist/${{ matrix.archive_name }}" -Force

    - name: Compress Archive (Linux)
      if: runner.os == 'Linux'
      run: |
        cd dist
        tar -czvf "${{ matrix.archive_name }}" "${{ matrix.artifact_name }}"
        cd ..

    - name: Compress Archive (macOS)
      if: runner.os == 'macOS'
      run: |
        cd dist
        zip -r "${{ matrix.archive_name }}" "${{ matrix.artifact_name }}"*
        cd ..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.archive_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Cryptographic SHA-256 Fixity Manifest
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          generate_release_notes: true