name: VHS Studio Build & Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Windows E2E & Full Quality Suite
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        uv pip install --system -e ".[dev,ai,cloud]"
        choco install ffmpeg --no-progress -y

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: 'ui/package-lock.json'

    - name: Install UI Dependencies & Playwright Browsers
      working-directory: ./ui
      run: |
        npm ci
        npx playwright install chromium

    - name: Run Swarm Auditors & Linter
      run: |
        python scripts/lint.py
        python scripts/swarm_auditors.py

    - name: Run Pytest
      run: python -m pytest tests/ -v

    - name: Run UI Tests (Playwright)
      working-directory: ./ui
      run: npx playwright test --project=chromium
