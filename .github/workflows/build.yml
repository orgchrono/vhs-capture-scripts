name: VHS Studio Build & Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-mock playwright
        playwright install
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install UI Dependencies
      working-directory: ./ui
      run: npm install
        
    - name: Run Swarm Auditors & Linter
      run: |
        python scripts/lint.py
        python scripts/swarm_auditors.py
        
    - name: Run Pytest
      run: pytest tests/ -v
      
    - name: Run UI Tests (Playwright)
      working-directory: ./ui
      run: npx playwright test

  build:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v3
    - name: Build Executable
      run: .\build.cmd
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.exe
          dist/*.zip
