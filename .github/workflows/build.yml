name: VHS Studio Build & Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  test:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,ai,cloud]"
        choco install ffmpeg --no-progress -y
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        
    - name: Install UI Dependencies & Playwright Browsers
      working-directory: ./ui
      run: |
        npm install
        npx playwright install chromium
        
    - name: Run Swarm Auditors & Linter
      run: |
        python scripts/lint.py
        python scripts/swarm_auditors.py
        
    - name: Run Pytest
      run: python -m pytest tests/ -v
      
    - name: Run UI Tests (Playwright)
      working-directory: ./ui
      run: npx playwright test --project=chromium

  build:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'release'
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Build Executable
      run: .\build.cmd
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.exe
          dist/*.zip
