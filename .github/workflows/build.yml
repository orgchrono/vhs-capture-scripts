name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vite UI
        run: |
          cd ui
          npm install
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .[ai,cloud]
          pip install webview fastapi uvicorn

      - name: Build Executable with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "VHS_Studio_Pro" --icon "vhs_icon.ico" --add-data "ui/dist;ui/dist" --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "uvicorn.lifespan" --hidden-import "uvicorn.lifespan.on" --hidden-import "googleapiclient" --hidden-import "keyring" --hidden-import "faster_whisper" --hidden-import "scenedetect" src/vhs_studio/__main__.py

      - name: Build Executable with PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Linux requires PyGObject for pywebview
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          pyinstaller --noconfirm --onefile --windowed --name "VHS_Studio_Pro_Linux" --icon "vhs_icon.png" --add-data "ui/dist:ui/dist" --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "uvicorn.lifespan" --hidden-import "uvicorn.lifespan.on" --hidden-import "googleapiclient" --hidden-import "keyring" --hidden-import "faster_whisper" --hidden-import "scenedetect" src/vhs_studio/__main__.py

      - name: Build Executable with PyInstaller (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "VHS_Studio_Pro_Mac" --icon "vhs_icon.icns" --add-data "ui/dist:ui/dist" --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "uvicorn.lifespan" --hidden-import "uvicorn.lifespan.on" --hidden-import "googleapiclient" --hidden-import "keyring" --hidden-import "faster_whisper" --hidden-import "scenedetect" src/vhs_studio/__main__.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VHS_Studio_Pro-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/VHS_Studio_Pro_Linux
            dist/VHS_Studio_Pro_Mac.app