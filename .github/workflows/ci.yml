name: Code Quality & Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'ui/package-lock.json'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,ai,cloud]
        
    - name: Lint Python with flake8 (Strict)
      run: |
        # Stop the build on syntax errors and undefined names
        flake8 src/vhs_studio --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Type check Python with mypy
      run: |
        mypy src/vhs_studio --ignore-missing-imports

    - name: Install UI Dependencies
      run: |
        cd ui
        npm ci

    - name: Type check UI (TypeScript)
      run: |
        cd ui
        npx tsc --noEmit

    - name: Build UI (Validation)
      run: |
        cd ui
        npm run build