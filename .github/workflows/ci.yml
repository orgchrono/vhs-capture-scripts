name: Cross-Platform CI & Quality Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    name: CI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Install System Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ffmpeg libgl1

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: 'ui/package-lock.json'

    - name: Install Python dependencies
      run: |
        uv pip install --system -e .[dev,ai,cloud]

    - name: Build Native Panasonic C Tools
      run: |
        python scripts/build_panasonic_tools.py

    - name: Lint Python with flake8 (Strict)
      if: runner.os == 'Linux'
      run: |
        flake8 src/vhs_studio --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Type check Python with mypy
      if: runner.os == 'Linux'
      run: |
        mypy src/vhs_studio --ignore-missing-imports

    - name: Run Python Pytest
      run: |
        python -m pytest tests/ -v

    - name: Install UI Dependencies
      working-directory: ./ui
      run: |
        npm ci

    - name: Type check and Build UI
      working-directory: ./ui
      run: |
        npm run build

    - name: Run UI Unit Tests (Vitest)
      working-directory: ./ui
      run: |
        npm run test:unit