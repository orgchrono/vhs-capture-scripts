name: CI Pipeline VHS Studio

on:
  push:
    branches: [ "main", "master", "v2/*" ]
  pull_request:
    branches: [ "main", "master", "v2/*" ]

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg shellcheck

      - name: Install FFmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg shellcheck

      - name: Install FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg

      - name: Install dependencies
        run: pip install ruff pyright

      - name: Lint Python with Ruff
        run: ruff check . || echo "Ruff errors are baseline for now"

      - name: Lint Python with Pyright
        run: pyright . || echo "Pyright errors are baseline for now"

      - name: Lint Shell scripts with ShellCheck
        if: matrix.os != 'windows-latest'
        run: find . -name "*.sh" -exec shellcheck -x {} +

      - name: Run Unit Tests
        run: python -m unittest discover tests
