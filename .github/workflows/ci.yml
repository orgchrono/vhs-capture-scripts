name: Cross-Platform CI & Quality Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gates:
    name: Full 9 Quality Gates & E2E (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install UI Dependencies & Playwright Browsers
        working-directory: ./ui
        run: |
          npm ci
          npx playwright install chromium

      - name: Build & Verify Native Panasonic C Tools
        run: node scripts/build_panasonic_tools.mts --verify

      - name: Run 9 Quality Gates Suite
        run: node scripts/lint.mts

      - name: Run Swarm Auditors
        run: node scripts/swarm_auditors.mts

  cross-platform:
    name: Platform Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libgl1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Build & Verify Native Panasonic C Tools
        run: node scripts/build_panasonic_tools.mts

      - name: Run Cargo Check
        run: cargo check

      - name: Run Cargo Clippy
        run: cargo clippy -- -D warnings

      - name: Run Native Rust Tests
        run: cargo test

      - name: Install UI Dependencies
        working-directory: ./ui
        run: npm ci

      - name: Type check and Build UI
        working-directory: ./ui
        run: npm run build

      - name: Run UI Unit Tests (Vitest)
        working-directory: ./ui
        run: npm run test:unit