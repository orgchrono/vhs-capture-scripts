name: Cross-Platform CI & Quality Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: CI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: 'ui/package-lock.json'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,ai,cloud]

    - name: Lint Python with flake8 (Strict)
      if: matrix.os == 'ubuntu-latest'
      run: |
        flake8 src/vhs_studio --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Type check Python with mypy
      if: matrix.os == 'ubuntu-latest'
      run: |
        mypy src/vhs_studio --ignore-missing-imports

    - name: Run Python Pytest
      run: |
        python -m pytest tests/ -v

    - name: Install UI Dependencies
      working-directory: ./ui
      run: |
        npm ci

    - name: Type check and Build UI
      working-directory: ./ui
      run: |
        npm run build

    - name: Run UI Unit Tests (Vitest)
      working-directory: ./ui
      run: |
        npm run test:unit