name: Code Quality & Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'ui/package-lock.json'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,ai,cloud]
        
    - name: Lint Python with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/vhs_studio --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 src/vhs_studio --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test Python backend with pytest
      run: |
        pytest tests/

    - name: Install UI Dependencies
      run: |
        cd ui
        npm install

    - name: Lint UI with ESLint
      run: |
        cd ui
        npm run lint || echo "ESLint not configured yet, skipping..."

    - name: Build UI (Dry-run for validation)
      run: |
        cd ui
        npm run build