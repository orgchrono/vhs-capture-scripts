# ruff.toml - Configuração do linter e formatador Ruff para VHS Studio

target-version = "py310"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (muitos comandos ffmpeg longos)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
