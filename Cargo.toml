[package]
name = "vhs-studio-core"
version = "0.1.0"
description = "VHS Studio Pro - Native Rust Functional Core & Tauri v2 Engine"
authors = ["VHS Studio Pro Engineering"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vhs_studio_core"
crate-type = ["rlib"]

[[bin]]
name = "vhs-studio"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2", default-features = false, features = ["wry"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Console",
] }

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
