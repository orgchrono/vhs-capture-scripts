# =======================================================
# VHS STUDIO PRO - ADVANCED CONFIGURATION (TOML)
# =======================================================
# This file centralizes internal engineering parameters, replacing
# magic numbers with architectural configuration. Intended for
# advanced users and video engineers tuning the engine.
# =======================================================

[capture]
# Tape background noise gate threshold. Anything below this level is treated as silence.
audio_threshold_db = -50.0

# Duration (in seconds) the audio silence must be broken to initiate auto-recording.
# Ultra-low value (0.10) ensures zero missed frames when playback starts.
start_confirm_sec = 0.10

# Duration (in seconds) tape must remain stopped (silence + blank/blue screen)
# for the engine to automatically cut and finalize the recording.
stop_blank_confirm_sec = 3.5

# Tolerance for silent scenes. If video motion continues while audio is completely
# silent, the engine waits this duration before cutting.
stop_quiet_scene_sec = 25.0

# Frequency (in seconds) for screen scanning to detect capture cards and video signal.
screenshot_interval_sec = 0.25


[vapoursynth]
# Advanced QTGMC tuning (Motion-adaptive deinterlacing & temporal synthesis)
# Valid presets: "Placebo", "Very Slow", "Slower", "Slow", "Medium", "Fast", "Faster", "Very Fast", "Super Fast", "Ultra Fast", "Draft"
qtgmc_preset_gold = "Slower"
qtgmc_preset_speed = "Faster"

# Advanced spatial chroma shift correction (removes VHS color registration misalignment)
chroma_shift_x = -2
chroma_shift_y = 0


[ffmpeg]
# Mathematical CRF compression factors for H.264/H.265
# (Lower CRF yields higher visual fidelity and larger file sizes)
crf_gold = 18
crf_speed = 22
crf_tbc_hold = 20
crf_ai_master = 16

# Visual scene cut detection threshold (SceneDetect)
scene_threshold = 27.0