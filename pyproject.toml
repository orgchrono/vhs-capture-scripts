[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vhs-studio"
version = "0.1.0"
description = "VHS Studio - Automated VHS capturing and frame-accurate restoration pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tomli; python_version < '3.11'",
    "websocket-client>=1.0.0", "fastapi", "uvicorn", "pywebview",
]

[project.scripts]
vhs-studio = "vhs_studio.cli.main:main"

[tool.setuptools]
packages = ["vhs_studio", "vhs_studio.core", "vhs_studio.video", "vhs_studio.config", "vhs_studio.cli"]
package-dir = {"" = "src"}
